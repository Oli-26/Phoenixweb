<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phoenix - Ability Directory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
</head>

<body>
<div id="app">
    <div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
        <div style="font-family: 'Merriweather', serif; font-size: 2rem; color: #2d8659; margin-bottom: 1rem;">
            Loading Ability Directory...
        </div>
        <div style="display: inline-block; width: 50px; height: 50px; border: 4px solid #dcf3e4; border-top-color: #38a169; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>
</div>

<style>
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>

<script type="module" src="js/app.js"></script>

<script>
    // Report content height to the parent frame (e.g. Wix) so it can auto-resize
    // the iframe. Harmless when not embedded — nothing listens, message is ignored.
    (function () {
        function postHeight() {
            parent.postMessage(
                { type: 'phoenix-height', height: document.documentElement.scrollHeight },
                '*'
            );
        }
        window.addEventListener('load', postHeight);
        window.addEventListener('resize', postHeight);
        window.addEventListener('hashchange', function () { setTimeout(postHeight, 50); });
        if (window.ResizeObserver) {
            new ResizeObserver(postHeight).observe(document.body);
        }
    })();
</script>
</body>

</html>
