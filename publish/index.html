<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phoenix - Ability Directory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
</head>

<body>
<div id="app">
    <div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
        <div style="font-family: 'Merriweather', serif; font-size: 2rem; color: #2d8659; margin-bottom: 1rem;">
            Loading Ability Directory...
        </div>
        <div style="display: inline-block; width: 50px; height: 50px; border: 4px solid #dcf3e4; border-top-color: #38a169; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>
</div>

<style>
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>

<script type="module" src="js/app.js"></script>

<div id="build-version" style="position: fixed; bottom: 4px; right: 8px; font-family: monospace; font-size: 0.7rem; color: #9ca3af; opacity: 0.6; z-index: 9999; pointer-events: none;"></div>
<script type="module" src="js/build-version.js"></script>
<script type="module" src="js/embed-height.js"></script>
</body>

</html>
